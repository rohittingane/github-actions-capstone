# This workflow runs automatically when someone opens a PR to main,
# or pushes new commits to an existing PR.

name: PR Pipeline

on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - synchronize

jobs:
    # Job 1: Call the reusable build-test workflow
    call-build-test:
        uses: ./.github/workflows/reusable-build-test.yml
        with:
            python_version: "3.12"
            run_tests: true

    # Job 2: Check project dependencies for known vulnerabilities
    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Dependency Review
              uses: actions/dependency-review-action@v4

    # Job 3: Runs after call-build-test succeeds
    pr-comment:
        needs: call-build-test
        runs-on: ubuntu-latest
        steps:
            - name: Print summary
              run: 'echo "PR checks passed for branch: ${{ github.head_ref }}"'
