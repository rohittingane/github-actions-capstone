# This is a REUSABLE workflow — it does NOT run on its own.
# It only runs when another workflow calls it using workflow_call.
name: Reusable - Docker Build and Push

on:
    workflow_call:
        # These values MUST be provided by the caller — no default exists
        inputs:
            image_name:
                required: true # Compulsory — e.g. "myapp"
                type: string
            tag:
                required: true # Compulsory — e.g. "latest" or "sha-abc123"
                type: string

        # Secrets are sensitive values (never shown in logs)
        secrets:
            docker_username:
                required: true # Docker Hub username
            docker_token:
                required: true # Docker Hub password/token

# Day 49 (DevSecOps): Limit this workflow's permissions to the minimum needed.
# By default GitHub gives broad permissions — we don't need write access to
# contents here, only read access to check out the code.
permissions:
    contents: read

jobs:
    docker-build-push:
        runs-on: ubuntu-latest

        # This makes image_url available to OTHER jobs that call this workflow
        outputs:
            image_url: ${{ steps.set_output.outputs.image_url }}

        steps:
            # Step 1: Bring the repository code onto this virtual machine
            - name: Checkout code
              uses: actions/checkout@v4

            # Step 2: Log in to Docker Hub using the secrets provided
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.docker_username }}
                  password: ${{ secrets.docker_token }}

            # Step 3: Build the Docker image ONLY — do NOT push yet.
            # We build first so we have an actual image to scan in the next step.
            # Pushing is deliberately delayed until after the vulnerability scan passes.
            - name: Build Docker image
              run: |
                  docker build -t ${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }} .

            # Step 4 (NEW - Day 49 DevSecOps): Scan the image for known vulnerabilities.
            # Trivy checks the image against a public CVE (Common Vulnerabilities
            # and Exposures) database.
            #   - image-ref      : exact image we just built, so it knows what to scan
            #   - format         : 'table' prints a human-readable table in the logs
            #   - exit-code      : '1' means "fail this step" if matching issues are found
            #                     (if this step fails, the workflow stops here —
            #                      the Push step below will NOT run)
            #   - severity       : only fail on CRITICAL or HIGH issues; ignore LOW/MEDIUM
            #   - ignore-unfixed : ignore vulnerabilities that currently have no available fix
            - name: Scan Docker Image for Vulnerabilities
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: "${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
                  format: "table"
                  exit-code: "1"
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true

            # Step 5: Push the image to Docker Hub.
            # This step ONLY runs if the scan above passed — GitHub Actions
            # automatically skips remaining steps when a previous step fails,
            # so no extra "if" condition is needed here.
            - name: Push Docker image
              run: |
                  docker push ${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}

            # Step 6: Save the full image path so the next job (deploy) can use it.
            # $GITHUB_OUTPUT is a special temporary file GitHub Actions provides —
            # anything written here as key=value becomes an accessible "output".
            - name: Set output
              id: set_output
              run: |
                  echo "image_url=${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}" >> $GITHUB_OUTPUT
